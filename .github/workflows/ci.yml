name: Windows CI

on:
  pull_request:
  push:
    branches:
      - main
      - "fix/ci-*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Migration regression tests compile a pinned pre-Pulse revision.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run fixtures
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run verify:tags
      - run: npm test
      - run: npm run test:e2e:smoke
      - run: npm run test:e2e
      - run: npm run desktop:pack
      - run: npm run test:desktop:smoke
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
