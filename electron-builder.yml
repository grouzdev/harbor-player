appId: com.grouzdev.mymusiclib
productName: MyMusicLib
electronDist: node_modules/electron/dist
directories:
  output: release
  buildResources: assets
files:
  - dist/**/*
  - verification/tag-support.json
  - assets/icon.ico
  - THIRD_PARTY_NOTICES.md
asar: true
asarUnpack:
  - node_modules/better-sqlite3/**/*
  - node_modules/sharp/**/*
  - node_modules/@img/**/*
npmRebuild: true
generateUpdatesFilesForAllChannels: true
publish:
  provider: github
  owner: grouzdev
  repo: my-music-lib
afterPack: scripts/after-pack.cjs
win:
  icon: assets/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: MyMusicLib
  deleteAppDataOnUninstall: false
  artifactName: "${productName}-${version}-${arch}-unsigned-Setup.${ext}"
portable:
  artifactName: "${productName}-${version}-${arch}-unsigned-portable.${ext}"
