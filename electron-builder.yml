appId: app.harborplayer.desktop
productName: Harbor Player
electronDist: node_modules/electron/dist
directories:
  output: release
  buildResources: assets
files:
  - dist/**/*
  - verification/tag-support.json
  - assets/icon.ico
  - THIRD_PARTY_NOTICES.md
  # The packaged app only runs on Windows x64. Keep its prebuilt SQLite binding
  # and omit source/build inputs plus bindings for other platforms.
  - "!node_modules/better-sqlite3/build/**/*"
  - "!node_modules/better-sqlite3/deps/**/*"
  - "!node_modules/better-sqlite3/src/**/*"
  - "!node_modules/better-sqlite3/binding.gyp"
  - "!node_modules/better-sqlite3/prebuilds/darwin-arm64.node"
  - "!node_modules/better-sqlite3/prebuilds/darwin-x64.node"
  - "!node_modules/better-sqlite3/prebuilds/linux-arm64.node"
  - "!node_modules/better-sqlite3/prebuilds/linux-x64.node"
  - "!node_modules/better-sqlite3/prebuilds/linuxmusl-arm64.node"
  - "!node_modules/better-sqlite3/prebuilds/linuxmusl-x64.node"
  - "!node_modules/better-sqlite3/prebuilds/win32-arm64.node"
asar: true
asarUnpack:
  - node_modules/better-sqlite3/**/*
  - node_modules/sharp/**/*
  - node_modules/@img/**/*
npmRebuild: true
electronLanguages:
  - en-US
generateUpdatesFilesForAllChannels: true
publish:
  provider: github
  owner: grouzdev
  repo: harbor-player
afterPack: scripts/after-pack.cjs
win:
  icon: assets/icon.ico
  signtoolOptions:
    publisherName:
      - SignPath Foundation
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Harbor Player
  deleteAppDataOnUninstall: false
  artifactName: "${productName}-${version}-${arch}-Setup.${ext}"
portable:
  artifactName: "${productName}-${version}-${arch}-portable.${ext}"
